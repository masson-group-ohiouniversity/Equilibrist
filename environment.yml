name: equilibrist
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.11
  - joblib>=1.3
  - pillow>=10.0
  - openpyxl>=3.1
  - matplotlib>=3.7
  - paramiko>=3.0          # supercomputer (SLURM) submission over SSH
  - pip
  - pip:
    - streamlit>=1.32
    - plotly>=5.18
    - nmrglue>=0.10        # NMR stack tool (nmr_stack.py); not on conda-forge/defaults, so installed by pip
