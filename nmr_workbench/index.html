<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; color: #222; background: transparent; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 2px 0 6px; flex-wrap: wrap; }
  .bar label.mode, .bar label.act { padding: 0 9px; border: 1px solid #bbb; border-radius: 12px; cursor: pointer; user-select: none; background: #f6f6f6;
                                    display: inline-flex; align-items: center; height: 25px; box-sizing: border-box; vertical-align: middle; }
  .bar label.act:active { background: #ddd; }
  .bar label.act.off { opacity: 0.4; cursor: default; }
  .bar label.mode.on { background: #2a78d6; color: #fff; border-color: #2a78d6; }
  .bar label.shape { padding: 2px 8px; border: 1px solid #bbb; border-radius: 10px; cursor: pointer; user-select: none; background: #f6f6f6; }
  .bar label.shape input { display: none; }
  .bar label.shape.on { background: #d62728; color: #fff; border-color: #d62728; }
  .bar label.tool { padding: 2px 8px; border: 1px solid #bbb; border-radius: 10px; cursor: pointer; user-select: none; background: #f6f6f6; }
  .bar label.tool.on { background: #444; color: #fff; border-color: #444; }
  .bar label.tool.erase.on { background: #d62728; border-color: #d62728; }
  .bar label.tool svg { vertical-align: -3px; }
  .bar input[type=radio] { display: none; }
  .row { display: flex; align-items: center; gap: 10px; margin: 4px 0; flex-wrap: wrap; }
  .row label { min-width: 62px; }
  input[type=range] { flex: 1; min-width: 160px; }
  input[type=number] { width: 72px; }
  button { padding: 3px 10px; }
  canvas { width: 100%; display: block; border: 1px solid #ddd; border-radius: 4px; background: #fff; }
  .hint { color: #666; font-size: 12px; min-height: 16px; }
  #phase { display: none; }
</style>
</head>
<body>
<div class="bar">
  <label class="mode on" data-mode="zoom"><input type="radio" name="mode" value="zoom" checked>🔍 zoom</label>
  <label class="mode" data-mode="calib"><input type="radio" name="mode" value="calib">🎯 calibrate</label>
  <label class="mode" data-mode="drag"><input type="radio" name="mode" value="drag">↔ drag a spectrum</label>
  <label class="mode" data-mode="sig"><input type="radio" name="mode" value="sig">〰 signals</label>
  <label class="mode" data-mode="phase"><input type="radio" name="mode" value="phase">🎚 phase</label>
  <label class="act off" id="bundo" title="Undo the last action (Ctrl/Cmd-Z over the plot)">↶ undo</label>
  <label class="act off" id="bredo" title="Redo what was undone (Shift-Ctrl/Cmd-Z over the plot)">↷ redo</label>
  <span id="sigwrap" style="display:none"><label class="tool on" id="tpick" title="Peak picking: a click, box, lasso or line records the chemical shift of the signal. Click to switch off when only integrals are wanted.">δ shift</label> <label class="tool on" id="tint" title="Integration: a click, box, lasso or line records the integral of the signal. Click to switch off when only shifts are wanted.">∫ integral</label> <label class="tool erase" id="terase" title="Eraser: click the vertical bar of a signal to remove its shift on that spectrum, its range bar to remove its integral. Click this button again to put the eraser away."><svg width="16" height="16" viewBox="0 0 24 24"><g transform="rotate(-40 12 12)"><rect x="3" y="8" width="18" height="9" rx="2" fill="#fff" stroke="currentColor" stroke-width="1.6"/><rect x="3" y="8" width="7" height="9" rx="2" fill="#f28b82" stroke="currentColor" stroke-width="1.6"/></g></svg> erase</label> &nbsp;<label class="shape on" title="Drag a rectangle: one ppm range for every spectrum it covers"><input type="radio" name="sshape" value="box" checked>▭ box</label> <label class="shape" title="Draw a free shape around a drifting signal: each spectrum gets the range the shape covers on it"><input type="radio" name="sshape" value="lasso">⌒ lasso</label> <label class="shape" title="Drag a straight line from a signal on one spectrum to the same signal on another: every spectrum in between is clicked where the line predicts it"><input type="radio" name="sshape" value="line">╱ line</label> <label class="shape" title="Deconvolute: drag a box around overlapping signals (already measured), on one spectrum or several. Everything in the box is fitted together as a set of lines; each signal takes its own lines, and what belongs to no signal (a shoulder, a neighbour) is fitted too and left out. Look at the result in the single-spectrum view (press s)."><input type="radio" name="sshape" value="deconv">⋏ deconvolute</label> &nbsp;<label>signal → </label><select id="sigsel"></select> <input id="signame" autocomplete="off" type="text" size="9" placeholder="name" title="Rename the selected signal (Enter)"> <button id="signew">new signal</button> &nbsp;<label title="Cap of the integration window: from the signal's outer lines outwards, the window ends where the trace is back at the baseline and never later than this many linewidths; a side also stops in the valley before a neighbour. On the stack the value applies to every spectrum; in the single-spectrum view (press s) to that spectrum alone. Limits dragged by hand on the spectra concerned return to automatic.">window ±</label> <input id="fitk" type="number" min="1" max="20" step="0.5" style="width:54px" title="Type a value and press Enter"> <span id="fitkunit" style="color:#666">linewidths, all spectra</span></span>
  <span style="flex:1"></span>
  <label>scale ×</label><input id="amp" type="range" min="0" max="1000" step="1" value="321" title="Vertical scale, logarithmic: 0.2 to 30" style="min-width:140px;max-width:200px"><span id="ampv">1</span>
  <button id="reset">reset view</button>
</div>
<div id="plot" style="position:relative"><canvas id="c" height="520" tabindex="0" style="outline:none"></canvas><div id="xcol" style="position:absolute;left:0;top:0;width:0;height:0"></div></div>
<div id="phase">
  <div class="row"><label>PHC0 (°)</label><input id="p0" autocomplete="off" type="range" min="-180" max="180" step="0.1" value="0"><input id="p0n" autocomplete="off" type="number" step="0.1" value="0"></div>
  <div class="row"><label>PHC1 (°)</label><input id="p1" autocomplete="off" type="range" min="-360" max="360" step="0.5" value="0"><input id="p1n" autocomplete="off" type="number" step="0.5" value="0">
    <span>apply to</span><select id="ptarget"><option value="__all__">all spectra</option></select>
    <button id="papply">Apply</button><button id="preset">Reset</button><span id="pinfo" class="hint"></span></div>
</div>
<div id="hint" class="hint"></div>
